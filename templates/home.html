{% extends 'base.html' %}

{% block content %}
<div class="auth-card card shadow-sm mx-auto text-center">
    <div class="card-body p-4">
        <h2 class="h4">Добро пожаловать, {{ user.first_name|default:user.username }}!</h2>
        <p class="text-muted mb-4">Вы вошли как <strong>{{ user.username }}</strong> ({{ user.email }})</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-danger" type="submit">Выйти</button>
        </form>
    </div>
</div>
{% endblock content %}
