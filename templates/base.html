<!DOCTYPE html>
{% load static %}
<html lang="ru">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}Мой кабинет{% endblock title %}</title>
</head>
<body class="bg-light">
    <main class="container py-5">

</body>
</html>
