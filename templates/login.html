{% extends 'base.html' %}

{% block title %}Вход{% endblock title %}

{% block content %}
<div class="auth-card card shadow-sm mx-auto">
    <div class="card-body p-4">
        <ul class="nav nav-pills nav-fill mb-4">
            <li class="nav-item"><span class="nav-link active">Вход</span></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Регистрация</a></li>
        </ul>
        <form method="post">
            {% csrf_token %}
            {% include '_form_fields.html' %}
            <button class="btn btn-success w-100" type="submit">Войти</button>
        </form>
    </div>
</div>
{% endblock content %}
